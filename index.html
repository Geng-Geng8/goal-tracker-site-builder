<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <meta name="description" content="Build a personal goal tracker. Your decisions, your actions, saved on your device.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'self'">
  <title>Universal Goal Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css?v=1">
  <script type="module" src="app.js?v=1"></script>
  <script type="module" src="student-examples.js?v=1"></script>
  <script src="pwa.js?v=1" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-row">
        <img class="app-logo" src="icon-192.png" alt="" width="48" height="48">
        <div class="brand-copy"><p class="eyebrow">YOUR GOAL. YOUR NEXT STEP.</p><p class="brand-title">Goal Tracker</p></div>
      </div>
      <div class="status-row">
        <span class="status-pill">Private on this browser</span>
        <span id="offlineStatus" class="status-pill" role="status"></span>
        <button id="installButton" class="button button-secondary hidden" type="button">Install app</button>
        <button id="updateButton" class="button button-secondary hidden" type="button">Update app</button>
      </div>
      <p id="pwaMessage" class="subtle" role="status"></p>
    </header>
    <div id="storageMessage" class="notice hidden" role="alert"></div>
    <main id="main" class="main-content" tabindex="-1"></main>
    <footer class="footer">
      <p>Your plan and progress stay in this browser. Nothing is sent to Glen or a backend. On a shared device, anyone using this browser profile may see them.</p>
      <button id="toolsButton" class="text-button" type="button">Backup &amp; settings</button>
    </footer>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <dialog id="confirmDialog" aria-labelledby="confirmTitle" aria-describedby="confirmDescription">
      <h2 id="confirmTitle"></h2><p id="confirmDescription"></p>
      <div id="confirmPreview"></div>
      <form method="dialog" class="button-row">
        <button class="button button-secondary" value="cancel" autofocus>Cancel</button>
        <button id="confirmYes" class="button" value="confirm">Confirm</button>
      </form>
    </dialog>
    <noscript><p>This tracker needs JavaScript enabled to save your actions on this device.</p></noscript>
  </div>
</body>
</html>
